<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voix → Clavier — Wireframes</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Caveat', cursive; background: #f0ede8; }

    /* ── Sketch primitives ───────────────────────────── */
    .sk-label {
      font-family: 'Caveat', cursive;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #888;
    }
    .sk-note {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      color: #aaa;
      font-style: italic;
    }
    .sk-section-label {
      font-family: 'Caveat', cursive;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #bbb;
    }
    .sk-arrow {
      color: #bbb;
      font-size: 18px;
      line-height: 1;
    }
    .sk-divider {
      border: none;
      border-top: 1.5px dashed #d5d0c8;
      margin: 12px 0;
    }
    .sk-box {
      border: 1.5px solid #c0b8ae;
      border-radius: 3px;
      background: #fff;
    }
    .sk-box-dashed {
      border: 1.5px dashed #c0b8ae;
      border-radius: 3px;
      background: transparent;
    }
    .artboard-wrap {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
      font-family: 'Caveat', cursive;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

/* ═══════════════════════════════════════════════════════════
   SHARED ATOMS
═══════════════════════════════════════════════════════════ */

const StateTag = ({ label, color }) => (
  <div style={{
    display: 'inline-block',
    fontFamily: 'Caveat, cursive',
    fontSize: 12,
    fontWeight: 700,
    letterSpacing: '.1em',
    textTransform: 'uppercase',
    color,
    borderBottom: `1.5px solid ${color}`,
    paddingBottom: 1,
    marginBottom: 8,
  }}>{label}</div>
);

const Annotation = ({ children, align = 'left' }) => (
  <div style={{
    fontFamily: 'Caveat, cursive',
    fontSize: 13,
    color: '#aaa',
    fontStyle: 'italic',
    textAlign: align,
    marginTop: 6,
    lineHeight: 1.35,
  }}>{children}</div>
);

/* Dot */
const Dot = ({ color, size = 9, pulse = false }) => (
  <div style={{
    width: size, height: size, borderRadius: '50%',
    background: color,
    flexShrink: 0,
    outline: pulse ? `2px solid ${color}44` : 'none',
    outlineOffset: 2,
  }} />
);

/* Waveform bars (static sketch) */
const WaveBars = ({ color, heights = [3,7,12,5,9,14,6,10,4,8] }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 2, height: 18 }}>
    {heights.map((h, i) => (
      <div key={i} style={{ width: 3, height: h, background: color, borderRadius: 2 }} />
    ))}
  </div>
);

/* Spinner sketch */
const Spinner = ({ color }) => (
  <div style={{
    width: 14, height: 14,
    border: `2px solid ${color}33`,
    borderTop: `2px solid ${color}`,
    borderRadius: '50%',
    flexShrink: 0,
  }} />
);

/* Mic icon (SVG) */
const MicIcon = ({ color, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>
    <rect x="5" y="1" width="6" height="9" rx="3" stroke={color} strokeWidth="1.5" />
    <path d="M3 8c0 2.76 2.24 5 5 5s5-2.24 5-5" stroke={color} strokeWidth="1.5" strokeLinecap="round" />
    <line x1="8" y1="13" x2="8" y2="15" stroke={color} strokeWidth="1.5" strokeLinecap="round" />
    <line x1="5" y1="15" x2="11" y2="15" stroke={color} strokeWidth="1.5" strokeLinecap="round" />
  </svg>
);

/* Keyboard icon */
const KeyIcon = ({ color, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>
    <rect x="1" y="3" width="14" height="10" rx="2" stroke={color} strokeWidth="1.5" />
    <line x1="4" y1="7" x2="4" y2="7" stroke={color} strokeWidth="2" strokeLinecap="round" />
    <line x1="8" y1="7" x2="8" y2="7" stroke={color} strokeWidth="2" strokeLinecap="round" />
    <line x1="12" y1="7" x2="12" y2="7" stroke={color} strokeWidth="2" strokeLinecap="round" />
    <line x1="5" y1="10" x2="11" y2="10" stroke={color} strokeWidth="2" strokeLinecap="round" />
  </svg>
);

/* Gear icon */
const GearIcon = ({ color, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>
    <circle cx="8" cy="8" r="2.5" stroke={color} strokeWidth="1.5" />
    <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke={color} strokeWidth="1.5" strokeLinecap="round" />
  </svg>
);

/* Check icon */
const CheckIcon = ({ color, size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 14 14" fill="none" style={{ flexShrink: 0 }}>
    <polyline points="2,7 6,11 12,3" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
  </svg>
);

/* Section splitter inside artboard */
const StateSplit = () => <hr style={{ border: 'none', borderTop: '1px dashed #e0dbd4', margin: '14px 0' }} />;

/* ═══════════════════════════════════════════════════════════
   SECTION 1 — PILL UI (4 variants)
═══════════════════════════════════════════════════════════ */

/* --- Pill A: Minimal Bar --- */
const PillA = () => {
  const pill = (dot, text, dotColor, textColor, bg, border) => (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 7,
      background: bg, border: `1.5px solid ${border}`,
      borderRadius: 20, padding: '5px 14px',
      width: 'fit-content',
    }}>
      <Dot color={dotColor} />
      <span style={{ fontFamily: 'Caveat, cursive', fontSize: 15, color: textColor }}>{text}</span>
    </div>
  );

  return (
    <div className="artboard-wrap">
      <div className="sk-label" style={{ marginBottom: 14 }}>A · Barre minimale</div>

      <StateTag label="Repos" color="#bbb" />
      {pill(null, 'prêt', '#ccc', '#bbb', '#f8f7f4', '#d5d0c8')}
      <Annotation>discret, fond translucide</Annotation>

      <StateSplit />
      <StateTag label="Écoute" color="#e03" />
      {pill(null, 'écoute…', '#e03', '#e03', '#fff4f4', '#e03')}
      <Annotation>point rouge pulse · bordure rouge</Annotation>

      <StateSplit />
      <StateTag label="Transcription" color="#2266ee" />
      {pill(null, 'traitement…', '#2266ee', '#2266ee', '#f2f5ff', '#2266ee')}
      <Annotation>point bleu · spinner ou dots animés</Annotation>

      <hr className="sk-divider" style={{ marginTop: 16 }} />
      <Annotation>Toujours visible, always-on-top. Repositionnable par glisser.</Annotation>
    </div>
  );
};

/* --- Pill B: Waveform --- */
const PillB = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 14 }}>B · Forme d'onde</div>

    <StateTag label="Repos" color="#bbb" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#f8f7f4', border: '1.5px solid #d5d0c8',
      borderRadius: 20, padding: '6px 14px', width: 'fit-content',
    }}>
      <MicIcon color="#ccc" size={14} />
      <WaveBars color="#ddd" heights={[3,3,3,3,3,3,3,3]} />
    </div>
    <Annotation>vague plate = silence</Annotation>

    <StateSplit />
    <StateTag label="Écoute" color="#e03" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#fff4f4', border: '1.5px solid #e03',
      borderRadius: 20, padding: '6px 14px', width: 'fit-content',
    }}>
      <MicIcon color="#e03" size={14} />
      <WaveBars color="#e03" heights={[3,9,14,6,11,15,7,9,4,8]} />
    </div>
    <Annotation>barres varient selon le volume du micro</Annotation>

    <StateSplit />
    <StateTag label="Transcription" color="#2266ee" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#f2f5ff', border: '1.5px solid #2266ee',
      borderRadius: 20, padding: '6px 14px', width: 'fit-content',
    }}>
      <Spinner color="#2266ee" />
      <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color: '#2266ee' }}>traitement…</span>
    </div>
    <Annotation>spinner pendant l'inférence Whisper</Annotation>

    <hr className="sk-divider" style={{ marginTop: 16 }} />
    <Annotation>Feedback visuel riche · plus grand · ~220px large</Annotation>
  </div>
);

/* --- Pill C: Icon Ring --- */
const PillC = () => {
  const ring = (color, bg, inner) => (
    <div style={{
      width: 48, height: 48, borderRadius: '50%',
      border: `2.5px solid ${color}`,
      background: bg,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      {inner}
    </div>
  );

  return (
    <div className="artboard-wrap">
      <div className="sk-label" style={{ marginBottom: 14 }}>C · Badge circulaire</div>

      <StateTag label="Repos" color="#bbb" />
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {ring('#ccc', '#f8f7f4', <MicIcon color="#bbb" size={18} />)}
        <Annotation style={{ marginTop: 0 }}>petit · coin d'écran</Annotation>
      </div>

      <StateSplit />
      <StateTag label="Écoute" color="#e03" />
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {ring('#e03', '#fff4f4', <MicIcon color="#e03" size={18} />)}
        <div>
          <Annotation style={{ marginTop: 0 }}>anneau rouge</Annotation>
          <Annotation>halo pulsé</Annotation>
        </div>
      </div>

      <StateSplit />
      <StateTag label="Transcription" color="#2266ee" />
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {ring('#2266ee', '#f2f5ff', <Spinner color="#2266ee" />)}
        <Annotation style={{ marginTop: 0 }}>anneau bleu tournant</Annotation>
      </div>

      <hr className="sk-divider" style={{ marginTop: 16 }} />
      <Annotation>Format compact ~50×50px. Idéal coin bas-droit.</Annotation>
    </div>
  );
};

/* --- Pill D: Ghost Bar with timer --- */
const PillD = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 14 }}>D · Pilule complète</div>

    <StateTag label="Repos" color="#bbb" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: 'transparent', border: '1.5px dashed #ccc',
      borderRadius: 20, padding: '5px 14px', width: 'fit-content',
    }}>
      <MicIcon color="#ccc" size={13} />
      <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color: '#bbb' }}>Voix→Clavier</span>
    </div>
    <Annotation>quasi-invisible quand inactif</Annotation>

    <StateSplit />
    <StateTag label="Écoute" color="#e03" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#e03', border: '1.5px solid #e03',
      borderRadius: 20, padding: '5px 14px', width: 'fit-content',
    }}>
      <MicIcon color="#fff" size={13} />
      <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color: '#fff', fontWeight: 600 }}>0:04</span>
      <WaveBars color="rgba(255,255,255,0.7)" heights={[5,10,7,13,8,11,6]} />
    </div>
    <Annotation>fond plein rouge · timer · waveform</Annotation>

    <StateSplit />
    <StateTag label="Transcription" color="#2266ee" />
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#2266ee', border: '1.5px solid #2266ee',
      borderRadius: 20, padding: '5px 14px', width: 'fit-content',
    }}>
      <Spinner color="rgba(255,255,255,0.9)" />
      <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color: '#fff' }}>traitement…</span>
    </div>
    <Annotation>fond plein bleu pendant l'inférence</Annotation>

    <hr className="sk-divider" style={{ marginTop: 16 }} />
    <Annotation>Riche en info · ~200px · le plus "présent" visuellement</Annotation>
  </div>
);

/* ═══════════════════════════════════════════════════════════
   SECTION 2 — SETTINGS PANEL (3 variants)
═══════════════════════════════════════════════════════════ */

const SettingRow = ({ label, control }) => (
  <div style={{
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    padding: '8px 0', borderBottom: '1px dashed #e8e4de',
    gap: 12,
  }}>
    <span style={{ fontFamily: 'Caveat, cursive', fontSize: 15, color: '#444', whiteSpace: 'nowrap' }}>{label}</span>
    <span style={{
      fontFamily: 'Caveat, cursive', fontSize: 13, color: '#888',
      background: '#f4f1ed', border: '1.5px solid #d5d0c8',
      borderRadius: 4, padding: '2px 10px',
      whiteSpace: 'nowrap',
    }}>{control}</span>
  </div>
);

const SettingSection = ({ title, children }) => (
  <div style={{ marginBottom: 14 }}>
    <div className="sk-section-label" style={{ marginBottom: 6 }}>{title}</div>
    {children}
  </div>
);

/* Settings A: Compact floating card */
const SettingsA = () => (
  <div className="artboard-wrap" style={{ gap: 0 }}>
    <div className="sk-label" style={{ marginBottom: 14 }}>A · Carte flottante compacte</div>

    <div className="sk-box" style={{ width: '100%', overflow: 'hidden', borderRadius: 6 }}>
      {/* Title bar */}
      <div style={{
        background: '#222', color: '#fff',
        fontFamily: 'Caveat, cursive', fontSize: 15, fontWeight: 700,
        padding: '7px 12px', display: 'flex', justifyContent: 'space-between',
        alignItems: 'center',
      }}>
        <span>⚙ Paramètres</span>
        <span style={{ color: '#888', cursor: 'pointer', fontSize: 16 }}>✕</span>
      </div>

      <div style={{ padding: '10px 14px' }}>
        <SettingSection title="Déclenchement">
          <SettingRow label="Mode" control="push-to-talk ▾" />
          <SettingRow label="Raccourci" control="Ctrl+Espace" />
        </SettingSection>
        <SettingSection title="Transcription">
          <SettingRow label="Modèle" control="large-v3 ▾" />
          <SettingRow label="Device" control="CUDA ▾" />
          <SettingRow label="Langue" control="Français ▾" />
        </SettingSection>
        <SettingSection title="Interface">
          <SettingRow label="Pilule" control="Variante D ▾" />
          <SettingRow label="Position" control="Bas-droite ▾" />
        </SettingSection>
        <div style={{ paddingTop: 10, display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
          <div style={{
            fontFamily: 'Caveat, cursive', fontSize: 14,
            border: '1.5px solid #d5d0c8', borderRadius: 4, padding: '4px 12px', color: '#888',
          }}>Annuler</div>
          <div style={{
            fontFamily: 'Caveat, cursive', fontSize: 14,
            background: '#222', borderRadius: 4, padding: '4px 12px', color: '#fff',
          }}>Enregistrer</div>
        </div>
      </div>
    </div>

    <Annotation style={{ marginTop: 8 }}>~320×360px · fenêtre modale flottante</Annotation>
  </div>
);

/* Settings B: Tabbed window */
const SettingsB = () => {
  const tabs = ['Général', 'Modèle', 'Micro', 'Interface'];
  return (
    <div className="artboard-wrap" style={{ gap: 0 }}>
      <div className="sk-label" style={{ marginBottom: 14 }}>B · Fenêtre à onglets</div>

      <div className="sk-box" style={{ width: '100%', borderRadius: 6, overflow: 'hidden' }}>
        {/* Traffic lights */}
        <div style={{
          background: '#f4f1ed', borderBottom: '1.5px solid #d5d0c8',
          padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 20,
        }}>
          <div style={{ display: 'flex', gap: 6 }}>
            {['#e55', '#fa0', '#5c5'].map((c, i) => (
              <div key={i} style={{ width: 11, height: 11, borderRadius: '50%', background: c }} />
            ))}
          </div>
          <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color: '#888', margin: '0 auto' }}>Voix→Clavier · Paramètres</span>
        </div>

        {/* Tabs */}
        <div style={{
          display: 'flex', borderBottom: '1.5px solid #d5d0c8',
          background: '#faf8f5',
        }}>
          {tabs.map((t, i) => (
            <div key={t} style={{
              fontFamily: 'Caveat, cursive', fontSize: 14,
              padding: '7px 14px',
              color: i === 0 ? '#222' : '#999',
              borderBottom: i === 0 ? '2.5px solid #222' : '2.5px solid transparent',
              cursor: 'pointer',
            }}>{t}</div>
          ))}
        </div>

        {/* Content pane */}
        <div style={{ padding: '12px 16px' }}>
          <SettingSection title="Déclenchement">
            <SettingRow label="Mode" control="push-to-talk ▾" />
            <SettingRow label="Raccourci" control="Ctrl+Espace" />
          </SettingSection>
          <SettingSection title="Démarrage">
            <SettingRow label="Lancer au démarrage" control="☑ oui" />
            <SettingRow label="Icône systray" control="☑ oui" />
          </SettingSection>
        </div>
      </div>

      <Annotation style={{ marginTop: 8 }}>~480×420px · réutilise chrome Windows natif</Annotation>
    </div>
  );
};

/* Settings C: Systray right-click menu */
const SettingsC = () => {
  const items = [
    { icon: '●', label: 'État : prêt', sub: true },
    null,
    { icon: '⚙', label: 'Paramètres…' },
    { icon: '◉', label: 'Mode : push-to-talk' },
    { icon: '♦', label: 'Langue : Français' },
    null,
    { icon: '✕', label: 'Quitter' },
  ];

  return (
    <div className="artboard-wrap" style={{ gap: 0 }}>
      <div className="sk-label" style={{ marginBottom: 14 }}>C · Menu systray</div>

      {/* Tray icon sketch */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
        <div style={{
          width: 28, height: 28, border: '1.5px solid #ccc', borderRadius: 4,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: '#f8f7f4',
        }}>
          <MicIcon color="#888" size={16} />
        </div>
        <Annotation style={{ margin: 0 }}>icône systray (barre des tâches)</Annotation>
      </div>

      {/* Context menu */}
      <div className="sk-box" style={{ width: 200, borderRadius: 4, overflow: 'hidden' }}>
        {items.map((item, i) => item === null ? (
          <div key={i} style={{ height: 1, background: '#e8e4de', margin: '2px 0' }} />
        ) : (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '7px 12px',
            fontFamily: 'Caveat, cursive',
            fontSize: item.sub ? 13 : 15,
            color: item.sub ? '#aaa' : '#333',
            background: i === 2 ? '#f4f1ed' : 'transparent',
          }}>
            <span style={{ color: '#bbb', fontSize: 12, width: 14, textAlign: 'center' }}>{item.icon}</span>
            <span>{item.label}</span>
          </div>
        ))}
      </div>

      <Annotation style={{ marginTop: 8 }}>Clic droit sur l'icône systray · accès rapide</Annotation>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════
   SECTION 3 — STATE MACHINE FLOW
═══════════════════════════════════════════════════════════ */

const FlowArrow = ({ label }) => (
  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, margin: '0 6px' }}>
    <div style={{ fontFamily: 'Caveat, cursive', fontSize: 11, color: '#bbb', whiteSpace: 'nowrap' }}>{label}</div>
    <div style={{ fontSize: 18, color: '#bbb', lineHeight: 1 }}>→</div>
  </div>
);

const FlowState = ({ label, color, bg, border }) => (
  <div style={{
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
    padding: '8px 14px', background: bg, border: `1.5px solid ${border}`,
    borderRadius: 8, minWidth: 70,
  }}>
    <Dot color={color} size={11} />
    <span style={{ fontFamily: 'Caveat, cursive', fontSize: 14, color, fontWeight: 600, whiteSpace: 'nowrap' }}>{label}</span>
  </div>
);

const StateMachineFlow = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 16 }}>Machine à états</div>
    <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 4, justifyContent: 'center' }}>
      <FlowState label="Repos" color="#aaa" bg="#f8f7f4" border="#d5d0c8" />
      <FlowArrow label="touche ↓" />
      <FlowState label="Écoute" color="#e03" bg="#fff4f4" border="#e03" />
      <FlowArrow label="touche ↑" />
      <FlowState label="Transcription" color="#2266ee" bg="#f2f5ff" border="#2266ee" />
      <FlowArrow label="résultat" />
      <FlowState label="Injection" color="#1a9" bg="#f0fff8" border="#1a9" />
    </div>
    <Annotation style={{ marginTop: 16, textAlign: 'center' }}>
      push-to-talk : repos→écoute au maintien, relâchement déclenche transcription
    </Annotation>
    <hr className="sk-divider" />
    <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 4, justifyContent: 'center' }}>
      <FlowState label="Repos" color="#aaa" bg="#f8f7f4" border="#d5d0c8" />
      <FlowArrow label="1er appui" />
      <FlowState label="Écoute" color="#e03" bg="#fff4f4" border="#e03" />
      <FlowArrow label="2e appui" />
      <FlowState label="Transcription" color="#2266ee" bg="#f2f5ff" border="#2266ee" />

    </div>
    <Annotation style={{ marginTop: 16, textAlign: 'center' }}>

    </Annotation>

);

/* Clipboard flow */
const ClipboardFlow = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 14 }}>Flux presse-papiers</div>
    {[
      ['1.', 'Sauvegarder', 'clipboard_old = get()'],
      ['2.', 'Écrire texte', 'set(texte_transcrit)'],

      ['5.', 'Restaurer', 'set(clipboard_old)'],

        display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0',

);

  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
    <div style={{
      width: 40, height: 40, borderRadius: 6,

    </div>
    <span style={{ fontFamily: 'Caveat, cursive', fontSize: 13, color }}>{label}</span>
  </div>
);

const TrayIcons = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 16 }}>Icônes systray</div>
    <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap', justifyContent: 'center' }}>
      <TrayIconState label="Repos" color="#aaa" bg="#f8f7f4" border="#ccc">

      <TrayIconState label="Écoute" color="#e03" bg="#fff4f4" border="#e03">

      </TrayIconState>
      <TrayIconState label="Traitement" color="#2266ee" bg="#f2f5ff" border="#2266ee">
        <Spinner color="#2266ee" />
      </TrayIconState>
      <TrayIconState label="Erreur" color="#e80" bg="#fffaf0" border="#e80">
        <span style={{ fontSize: 20 }}>⚠</span>
      </TrayIconState>
    </div>
    <Annotation style={{ marginTop: 14, textAlign: 'center' }}>16×16 ou 32×32 px · monochrome ou couleur</Annotation>
  </div>
);

/* ═══════════════════════════════════════════════════════════
   SECTION 5 — FIRST-RUN / ERROR STATES
═══════════════════════════════════════════════════════════ */

const ToastNotif = ({ type }) => {
  const configs = {
    ready: { bg: '#f0fff8', border: '#1a9', dot: '#1a9', title: 'Voix→Clavier prêt', sub: 'Modèle large-v3 chargé sur GPU', icon: '✓' },
    error: { bg: '#fffaf0', border: '#e80', dot: '#e80', title: 'GPU introuvable', sub: 'Repli sur CPU · modèle tiny', icon: '⚠' },
    nocuda: { bg: '#fff4f4', border: '#e03', dot: '#e03', title: 'Erreur micro', sub: 'Aucun périphérique détecté', icon: '✕' },
  };
  const c = configs[type];
  return (
    <div style={{
      display: 'flex', alignItems: 'flex-start', gap: 10,
      background: c.bg, border: `1.5px solid ${c.border}`,
      borderRadius: 6, padding: '10px 14px', width: '100%',
    }}>
      <span style={{ fontSize: 16, color: c.dot, marginTop: 1, flexShrink: 0 }}>{c.icon}</span>
      <div>
        <div style={{ fontFamily: 'Caveat, cursive', fontSize: 15, fontWeight: 700, color: '#333' }}>{c.title}</div>
        <div style={{ fontFamily: 'Caveat, cursive', fontSize: 13, color: '#888', marginTop: 2 }}>{c.sub}</div>
      </div>
    </div>
  );
};

const Notifications = () => (
  <div className="artboard-wrap">
    <div className="sk-label" style={{ marginBottom: 14 }}>Notifications systray</div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <ToastNotif type="ready" />
      <ToastNotif type="error" />
      <ToastNotif type="nocuda" />
    </div>
    <Annotation style={{ marginTop: 10 }}>Balloon Windows ou toast PyQt · ~4 s</Annotation>
  </div>
);

  <DesignCanvas>

</script>
